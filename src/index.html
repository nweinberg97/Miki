<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Miki (三木, three trees) is a place for your thoughts to take root: grounded in intention, alive with ideas, standing on what you choose.">
    <meta name="theme-color" content="#EEF0E9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#171D19" media="(prefers-color-scheme: dark)">
    <title>Miki</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <script>
      try {
        var t = localStorage.getItem("miki:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <!--HEAD-->
  </head>
  <body>
    <div id="root"></div>
    <noscript>Miki needs JavaScript to run.</noscript>
    <!--BODY-->
  </body>
</html>
