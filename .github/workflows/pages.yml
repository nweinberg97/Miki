# Keeps the live site (GitHub Pages, deployed from the main branch) in step with the code.
# On every push to main it builds Miki into one self-contained file and commits it as /index.html.
name: Build the live site

on:
  push:
    branches: [main]
    paths-ignore: ["index.html"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:single
      - name: Commit the built app as index.html
        run: |
          cp dist-single/miki.html index.html
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update the live site (index.html) from ${GITHUB_SHA::7}"
          git push
